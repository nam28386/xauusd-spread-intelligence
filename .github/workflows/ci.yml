name: Phase 01 deterministic core

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase01-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: '3.12'
      PYTHONHASHSEED: '0'
      TZ: UTC
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned tooling and locked Linux dependencies (no MT5 extra)
        run: |
          python -m pip install uv==0.13.6
          uv sync --frozen --extra dev
      - run: uv run --frozen --extra dev ruff check .
      - run: uv run --frozen --extra dev ruff format --check .
      - run: uv run --frozen --extra dev pytest
      - run: uv run --frozen python scripts/audit_repository.py
      - run: uv run --frozen python scripts/smoke_api.py
      - run: uv run --frozen python scripts/smoke_live.py
      - run: uv run --frozen python -m xbsis replay
# No broker credentials, account data, SDK import, live tests, or artifact uploads.
