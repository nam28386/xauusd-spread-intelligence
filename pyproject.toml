[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "xbsis"
version = "0.1.0"
description = "Synthetic, read-only XAUUSD spread observation core"
requires-python = "==3.12.*"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "duckdb>=1.2,<2",
  "uvicorn>=0.34,<1",
  "websockets>=13,<16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
    "httpx2>=2.16,<3",
    "playwright>=1.50,<2",
]
mt5 = ["MetaTrader5>=5.0,<6; sys_platform == 'win32' and platform_machine == 'AMD64'"]

[project.scripts]
xbsis = "xbsis.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/xbsis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
